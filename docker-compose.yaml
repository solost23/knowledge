services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: knowledge-api:local
    restart: unless-stopped
    init: true
    environment:
      APP_HOST: 0.0.0.0
      APP_MODE: release
      APP_DATA_DIR: /app/backend/data
      AGENT_CHECKPOINT_DB: /app/backend/data/agent_checkpoints.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHATGLM_API_KEY: ${CHATGLM_API_KEY:-}
    volumes:
      - ./backend/data:/app/backend/data
    expose:
      - "8086"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: knowledge-web:local
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
