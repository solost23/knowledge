name: "knowledge"
mode: "debug"
host: "127.0.0.1"
port: 8086

llm:
  # 可替换为 chat_glm
  name: "chat_gpt"

chat_glm:
  # 需暴露 OpenAI 兼容接口（vLLM / Ollama / ChatGLM 均可）
  endpoint_url: "http://127.0.0.1:8000"
  model: "chatglm3"
  max_token: 4096
  timeout: 60

chat_gpt:
  # api_key 从环境变量 OPENAI_API_KEY 读取（可写在 .env）
  base_url: "https://724ai.org/v1"
  model: "claude-sonnet-5"
  max_token: 4096
  temperature: 0
  timeout: 60


chroma:
  persist_directory: "./data/chroma_db"
  import_batch_size: 256
  # 相关性分数范围为 0 到 1，低于阈值的片段不会交给模型
  top_k: 4
  relevance_threshold: 0.35

embedding:
  # fastembed + ONNX Runtime，模型首次使用时自动下载到 cache_path
  model_name: "BAAI/bge-small-zh-v1.5"
  cache_path: "./data/huggingface"
  threads: 4
  batch_size: 256

agent:
  max_task_length: 2000
  max_step_length: 300
  max_search_results: 4
  max_search_query_length: 500
  max_source_length: 2000
  max_listed_documents: 50
  # LangGraph recursion guard; long plans receive a larger limit automatically.
  recursion_limit: 10000

documents:
  chunk_size: 500
  chunk_overlap: 50

upload:
  max_size_mb: 100

conversation:
  max_summary_chars: 1500
  max_history_messages: 10
  max_history_chars: 6000
  max_history_message_chars: 2500
  keep_recent_messages: 6
  compress_after_messages: 8
  compress_after_chars: 8000
  max_compression_batch_chars: 8000
  max_compression_message_chars: 2000
