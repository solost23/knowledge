name: "knowledge"
mode: "debug"
host: "127.0.0.1"
port: 8086

llm:
  # 可替换为 chat_glm
  name: "chat_gpt"

chat_glm:
  # 需暴露 OpenAI 兼容接口（vLLM / Ollama / ChatGLM 均可）
  endpoint_url: "http://127.0.0.1:8000"
  model: "chatglm3"
  max_token: 4096
  timeout: 60

chat_gpt:
  # api_key 从环境变量 OPENAI_API_KEY 读取（可写在 .env）
  base_url: "https://724ai.org/v1"
  model: "claude-sonnet-5"
  max_token: 4096
  temperature: 0


chroma:
  persist_directory: "./data/chroma_db"
  # 相关性分数范围为 0 到 1，低于阈值的片段不会交给模型
  top_k: 4
  relevance_threshold: 0.35

embedding:
  # fastembed + ONNX Runtime，模型首次使用时自动下载到 cache_path
  model_name: "BAAI/bge-small-zh-v1.5"
  cache_path: "./data/huggingface"
  threads: 4

# 缓存层已随 LangChain 1.x 迁移移除，将在 P3 以带护栏的方式重做
