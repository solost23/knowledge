name: "knowledge"
mode: "debug"
host: "0.0.0.0"
port: 8086

llm:
  # 可替换为 chat_gpt
  name: "chat_glm"

chat_glm:
  endpoint_url: "http://127.0.0.1:8000"
  max_token: 80000
  timeout: 60

chat_gpt:
  # api_key 从环境变量 OPENAI_API_KEY 读取
  max_token: 40000

wen_xin:
  # api_key 从环境变量 WENXIN_API_KEY 读取
  # secret_key 从环境变量 WENXIN_SECRET_KEY 读取

chroma:
  persist_directory: "./chroma_db"

embedding:
  cache_path: "./huggingface"
  model_name: "./huggingface/sentence-transformers_paraphrase-multilingual-MiniLM-L12-v2"
  multi_process: False
  model_kwargs:
    device: "mps"
  encode_kwargs:
    normalize_embeddings: False

cache:
  use: True
  search_distance_evaluation:
    max_distance: 4.0
    positive: False
  