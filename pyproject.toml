[project]
name = "knowledge"
version = "2.0.0"
description = "企业知识库 RAG 与 Agent 服务：文档检索、任务规划和工具执行"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1,<4",
    "flask-openapi3[swagger]>=4.3,<5",
    "langchain>=1.4,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.7,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "fastembed>=0.9,<1",
    "chromadb>=1.5,<2",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0,<7",
    "loguru>=0.7,<1",
    "python-dotenv>=1.2,<2",
    "pypdf>=6,<7",
    "python-pptx>=1.0,<2",
    "docx2txt>=0.9,<1",
    "openpyxl>=3.1,<4",
    "langgraph-checkpoint-sqlite>=2,<4",
]

[tool.uv]
package = false
